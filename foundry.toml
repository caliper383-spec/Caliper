[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 400
via_ir = false
evm_version = "paris"
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./node_modules" },
]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
rhtestnet = "https://rpc.testnet.chain.robinhood.com"
rhmainnet = "https://rpc.mainnet.chain.robinhood.com"
